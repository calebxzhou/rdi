plugins {
    id 'java-library'
}

group = "calebxzhou.rdi.mc.common2"
version = "0.1"

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets.named('main') {
    java.srcDir '../../../mc/rmcp/src/main/java'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
