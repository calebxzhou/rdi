plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.0'
}

base {
    archivesName = "rdi"
}

version = "5-mc-server-1.20.1-forge"
group = "calebxzhou.rdi"

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}
sourceSets.main {
    ext["refMap"] = "rdi.mixins.refmap.json"
}
mixin {
    add sourceSets.main, 'rdi.mixins.refmap.json'
    config "rdi.mixins.json"
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = "Forge Maven"
        url = "https://maven.minecraftforge.net/"
    }

}
legacyForge {
    version = "1.20.1-47.4.13"
    runs {
        server {
            server()
            systemProperty("rdi.ihq.url", "127.0.0.1:65231")
            systemProperty("rdi.host.id", "695f9e5ad05510e77c09ea1a")
            systemProperty("mixin.hotSwap", "true")
            programArguments = [
                "--nogui",
                    "-mixin.config=rdi.mixins.json",
            ]
        }
    }
    mods {
        rdi {

            sourceSet sourceSets.main

        }
    }
    parchment {
        // Get versions from https://parchmentmc.org/docs/getting-started
        // Omit the "v"-prefix in mappingsVersion
        minecraftVersion = "1.20.1"
        mappingsVersion = "2023.09.03"
    }
}

def shadedConfiguration = configurations.maybeCreate('shaded')
dependencies {
    compileOnly("org.jetbrains.kotlin:kotlin-stdlib:2.4.0")
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.3"))
    implementation project(':s-mc-common')
    additionalRuntimeClasspath project(':s-mc-common')
    implementation project(':s-mc-common2')
    additionalRuntimeClasspath project(':s-mc-common2')
    implementation project(':rcmd')
    additionalRuntimeClasspath project(':rcmd')
    shaded 'com.neovisionaries:nv-websocket-client:2.14'
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0")
}

// Ensure the common project is evaluated before we look up its tasks/outputs
evaluationDependsOn(':s-mc-common')
evaluationDependsOn(':s-mc-common2')
evaluationDependsOn(':rcmd')

processResources {
    var properties = [
            "mod_license"      : "gplv3",
            "mod_id"           : mod_id,
            "version"          : version,
            "mod_name"         : mod_name,
            "mod_author"       : mod_authors,
            "forge_version"    : forge_version,
            "minecraft_version": minecraft_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    javaCompiler.set(javaToolchains.compilerFor {
        languageVersion.set(JavaLanguageVersion.of(25))
    })
    options.release.set(25)

    options.compilerArgs << "-Xlint:-deprecation"
    options.compilerArgs << "-Xlint:-removal"
}

java {
    withSourcesJar()
}

jar {
    // Bundle compiled outputs from shared server modules into this jar
    dependsOn project(":s-mc-common").tasks.named("classes")
    dependsOn project(":s-mc-common2").tasks.named("classes")
    dependsOn project(":rcmd").tasks.named("classes")
    from(project(":s-mc-common").sourceSets.main.output)
    from(project(":s-mc-common2").sourceSets.main.output)
    from(project(":rcmd").sourceSets.main.output)
    from({
        shadedConfiguration.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "rdi.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(GroovyCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(ScalaCompile) {
    scalaCompileOptions.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
project(':s-mc-common').ext.registerServerCopyTask(project)
