pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name="s20"
include(":s-mc-common")
project(":s-mc-common").projectDir = file("../common")
include(":rcmd")
project(":rcmd").projectDir = file("../../../mc/rcmd")
include(":firmsection")
project(":firmsection").projectDir = file("../../../mc/firmsection")
