plugins {
    id 'java-library'
}

group = "calebxzhou.rdi.mc.common2"
version = "0.1"

repositories {
    mavenLocal()
    mavenCentral()
}


dependencies {
    api project(":rcmd")
    api 'io.fusionauth:java-http:1.4.0'
    implementation project(':rcmd')
    compileOnly 'com.google.code.gson:gson:2.11.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
