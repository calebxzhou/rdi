plugins {
    id 'java-library'
}

group = "calebxzhou.rdi.mc.common2"
version = "0.1"

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets.named('main') {
    java.srcDir '../../../mc/rcmd/src/main/java'
}

dependencies {
    api 'io.fusionauth:java-http:1.4.0'
    compileOnly 'com.google.code.gson:gson:2.11.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
