plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}
base {
    archivesName = "rdi"
}
version = "5-mc-client-${mcVersion}-forge"
evaluationDependsOn(":c-mc-common")

mixin {
    add sourceSets.main, "rdi.mixins.refmap.json"
    config "rdi.mixins.json"
}

minecraft {
    mappings channel: 'parchment', version: "2022.03.06-${project.mcVersion}"

    runs {
        client {
            properties 'forge.logging.markers': ''
            properties 'forge.logging.console.level': 'debug'
            workingDirectory project.file('run').canonicalPath
            source sourceSets.main
            properties "rdi.ihq.url": "http://127.0.0.1:65231"
            properties "rdi.game.ip": "127.0.0.1:65230"
            properties "rdi.host.name": "测试测试12123大世界"
            properties "rdi.host.port": "25565"
            arg "-mixin.debug=true"
            arg "-mixin.checks.interfaces=true"
            arg "-mixin.config=rdi.mixins.json"
            arg "--username"
            arg "哇塞的哇塞的"
            arg "--uuid"
            arg "68b314bbadaf52ddab96b5ed00000000"
            arg "--width"
            arg "2560"
            arg "--height"
            arg "1440"

        }
    }
}
processResources {
    dependsOn project(":c-mc-common").tasks.processResources

}
sourceSets {
    main {
        java {
            srcDir project(":c-mc-common").sourceSets.main.java.srcDirs
        }
        resources {
            srcDir project(":c-mc-common").sourceSets.main.resources.srcDirs
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.mcVersion}-${project.forgeVersion}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation(project(":c-mc-common"))
}

jar {
    manifest {
        attributes(["Specification-Title"     : project.name,
                    "Specification-Vendor"    : project.author,
                    "Specification-Version"   : "24.0",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.version,
                    "Implementation-Vendor"   : project.author,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs"            : "rdi.mixins.json"],)
    }
}
project(':c-mc-common').ext.registerClientCopyTask(project)