def shadedConfiguration = configurations.maybeCreate('shaded')
def architecturyApiConfiguration = configurations.maybeCreate('architecturyApi')
tasks.register('patchArchitecturyMixin') {
    inputs.files(architecturyApiConfiguration)
    outputs.upToDateWhen { false }

    doLast {
        def sourceJar = architecturyApiConfiguration.files.find { it.name.endsWith('.jar') }
        if (sourceJar == null) {
            throw new GradleException('architectury-api jar not found')
        }
        def patchedJar = new File(sourceJar.parentFile, "${sourceJar.name}.rdi-patched")
        def changed = false

        new ZipFile(sourceJar).withCloseable { zip ->
            new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(patchedJar))).withCloseable { out ->
                zip.entries().each { entry ->
                    out.putNextEntry(new ZipEntry(entry.name))
                    if (!entry.directory) {
                        if (entry.name == 'architectury.mixins.json') {
                            def json = new JsonSlurper().parse(zip.getInputStream(entry))
                            def mixins = json.mixins.findAll { it != 'MixinFallingBlockEntity' }
                            changed = changed || mixins.size() != json.mixins.size()
                            json.mixins = mixins
                            out.write(JsonOutput.prettyPrint(JsonOutput.toJson(json)).getBytes(StandardCharsets.UTF_8))
                        } else {
                            zip.getInputStream(entry).withCloseable { input ->
                                input.transferTo(out)
                            }
                        }
                    }
                    out.closeEntry()
                }
            }
        }
        if (changed) {
            Files.move(patchedJar.toPath(), sourceJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        } else {
            patchedJar.delete()
        }
    }
}

legacyForge {
    version = "1.20.1-47.4.20"
    runs {
        client {
            client()
            systemProperty("rdi.play", Base64.encoder.encodeToString(playArg.getBytes(StandardCharsets.UTF_8)))
            //systemProperty("mixin.hotSwap", "true")
            programArguments = [
                    "--enable-native-access=ALL",
                    "-mixin.config=rdi.mixins.json",
                    "--width",
                    "2560",
                    "--height",
                    "1440",
                    "--username",
                    selectedPlayerName,
                    "--uuid",
                    selectedPlayerUuid.replace("-", "")
            ]
            gameDirectory = project.file('run')
        }
    }
    mods {
        rdi {

            sourceSet sourceSets.main

        }
    }
    parchment {
        // Get versions from https://parchmentmc.org/docs/getting-started
        // Omit the "v"-prefix in mappingsVersion
        minecraftVersion = "1.20.1"
        mappingsVersion = "2023.09.03"
    }
}

