jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Bundle compiled classes from :c-mc-common into this jar.
    // Common resources are already added via sourceSets.main.resources above.
    dependsOn project(":c-mc-common").tasks.named("classes")
    dependsOn project(":c-mc-common2").tasks.named("classes")
    dependsOn project(":rcmd").tasks.named("classes")
    dependsOn project(":firmsection").tasks.named("classes")
    from(project(":c-mc-common").sourceSets.main.output.classesDirs)
    from(project(":c-mc-common2").sourceSets.main.output.classesDirs)
    from(project(":rcmd").sourceSets.main.output)
    from(project(":firmsection").sourceSets.main.output)
    from({
        shadedConfiguration.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "rdi.mixins.json"
        ])
    }
}

