import java.nio.charset.StandardCharsets
import java.util.Base64

plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.124'
    id "org.jetbrains.kotlin.jvm" version "2.2.21"
}

// Ensure the common project is configured before we read its outputs
evaluationDependsOn(":c-mc-common")
evaluationDependsOn(":c-mc-common2")

base {
    archivesName = "rdi"
}

version = "5-mc-client-1.20.1-forge"
group = "calebxzhou.rdi"

def requestedTasks = gradle.startParameter.taskNames.collect { it.tokenize(':').last() } as Set
def useAnotherPlayer = requestedTasks.contains('runClientAnother')
def selectedPlayerName = findProperty(useAnotherPlayer ? 'minecraft_username_another' : 'minecraft_username') ?: 'Developer'
def selectedPlayerUuid = findProperty(useAnotherPlayer ? 'minecraft_uuid_another' : 'minecraft_uuid') ?: '68b314bb-adaf-52dd-ab96-b5ed00000000'
def playArg = [
        "http://127.0.0.1:65231",
        "127.0.0.1:65230",
        "测试测试12123主机",
        "25565",
        selectedPlayerUuid,
        selectedPlayerName
].join("\n")

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_21
}
kotlin {
    jvmToolchain(21)
}
sourceSets.main {
    ext["refMap"] = "rdi.mixins.refmap.json"
    // Make shared assets available in IDE/dev runs (runClient).
    resources {
        srcDir project(":c-mc-common").file("src/main/resources")
    }
}
mixin {
    add sourceSets.main, 'rdi.mixins.refmap.json'
    config "rdi.mixins.json"
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = "Forge Maven"
        url = "https://maven.minecraftforge.net/"
    }

}
legacyForge {
    version = "1.20.1-47.4.13"
    runs {
        client {
            client()
            systemProperty("rdi.play", Base64.encoder.encodeToString(playArg.getBytes(StandardCharsets.UTF_8)))
            systemProperty("mixin.hotSwap", "true")
            programArguments = [
                    "-mixin.config=rdi.mixins.json",
                    "--width",
                    "2560",
                    "--height",
                    "1440",
                    "--username",
                    selectedPlayerName,
                    "--uuid",
                    selectedPlayerUuid.replace("-", "")
            ]
            gameDirectory = project.file('run')
        }
    }
    mods {
        rdi {

            sourceSet sourceSets.main

        }
    }
    parchment {
        // Get versions from https://parchmentmc.org/docs/getting-started
        // Omit the "v"-prefix in mappingsVersion
        minecraftVersion = "1.20.1"
        mappingsVersion = "2023.09.03"
    }
}

dependencies {
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    // https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-stdlib
    additionalRuntimeClasspath("org.jetbrains.kotlin:kotlin-stdlib:2.2.21")
    implementation(project(":c-mc-common"))
    additionalRuntimeClasspath(project(":c-mc-common"))
    implementation(project(":c-mc-common2"))
    additionalRuntimeClasspath(project(":c-mc-common2"))
    //jarjar(project(":c-mc-common"))
}

processResources {
    var properties = [
            "mod_license"      : "gplv3",
            "mod_id"           : mod_id,
            "version"          : version,
            "mod_name"         : mod_name,
            "mod_author"       : mod_authors,
            "forge_version"    : forge_version,
            "minecraft_version": minecraft_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    javaCompiler.set(javaToolchains.compilerFor {
        languageVersion.set(JavaLanguageVersion.of(21))
    })
    options.release.set(21)

    options.compilerArgs << "-Xlint:-deprecation"
    options.compilerArgs << "-Xlint:-removal"
}

java {
    withSourcesJar()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Bundle compiled classes from :c-mc-common into this jar.
    // Common resources are already added via sourceSets.main.resources above.
    dependsOn project(":c-mc-common").tasks.named("classes")
    dependsOn project(":c-mc-common2").tasks.named("classes")
    from(project(":c-mc-common").sourceSets.main.output.classesDirs)
    from(project(":c-mc-common2").sourceSets.main.output.classesDirs)

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "rdi.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(GroovyCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(ScalaCompile) {
    scalaCompileOptions.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

tasks.register("runClientAnother") {
    group = "minecraft"
    description = "Run Minecraft client with another player name and RDI play arg"
    dependsOn("runClient")
}

project(':c-mc-common').ext.registerClientCopyTask(project)
