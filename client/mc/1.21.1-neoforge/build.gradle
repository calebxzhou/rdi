import java.nio.charset.Charset

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.0'
    id 'org.gradlex.extra-java-module-info' version '1.14.2'
}

wrapper {
    distributionType = Wrapper.DistributionType.BIN
}
group = mod_group_id
version = mod_version

repositories {
    mavenLocal()
    mavenCentral()
    //CurseForge
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    //Modrinth
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Jared"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }

    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
}

base {
    archivesName = mod_id
}

def sharedBuildProjects = [':c-mc-common',/* ':rmcp-common', ':rmcp-client'*/':mediaproc']
project(':mediaproc').tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    enabled = false
}
sharedBuildProjects.each { projectPath ->
    project(projectPath).layout.buildDirectory.set(
            rootProject.layout.buildDirectory.dir("shared/${projectPath.substring(1)}")
    )
}

gradle.projectsEvaluated {
    def sharedJarTasks = sharedBuildProjects.collect { projectPath ->
        rootProject.project(projectPath).tasks.named('jar')
    }
    tasks.matching {
        it.name == 'writeClientLegacyClasspath' || it.name == 'writeClient2LegacyClasspath'
    }.configureEach {
        dependsOn(sharedJarTasks)
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    evaluationDependsOn(':c-mc-common')
  /*  evaluationDependsOn(':rmcp-common')
    evaluationDependsOn(':rmcp-client')*/
    evaluationDependsOn(':mediaproc')
    // Bundle compiled classes from :c-mc-common into this jar.
    // Common resources are already added via sourceSets.main.resources above.
    dependsOn project(":c-mc-common").tasks.named("classes")
   /* dependsOn project(":rmcp-common").tasks.named("classes")
    dependsOn project(":rmcp-client").tasks.named("classes")*/
    from(project(":c-mc-common").sourceSets.main.output.classesDirs)
    /*from(project(":rmcp-common").sourceSets.main.output)
    from(project(":rmcp-client").sourceSets.main.output)*/
    from({
        configurations.shaded.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "rdi.mixins.json"
        ])
    }
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    validateAccessTransformers = true
    def playArg = "http://127.0.0.1:65231\n127.0.0.1:56370\n测试测试12123大世界\n56370\n68b314bb-adaf-52dd-ab96-b5ed00000000\ndev1"
    def playArg2 = "http://127.0.0.1:65231\n127.0.0.1:56370\n测试测试12123大世界\n56370\n68b314bb-adaf-52dd-ab96-e5ed00000000\ndev2"
    runs {
        client {
            client()
            programArgument '--width'
            programArgument '2560'
            programArgument '--height'
            programArgument '1440'
            programArgument '--quickPlayMultiplayer'
            programArgument 'localhost:56370'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'mixin.hotSwap', 'true'
            systemProperty 'rdi.debug', 'true'
            systemProperty 'rdi.play', Base64.encoder.encodeToString(playArg.getBytes(Charset.forName("UTF-8")))

        }
        client2 {
            client()
            programArgument '--width'
            programArgument '2560'
            programArgument '--height'
            programArgument '1440'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'mixin.hotSwap', 'true'
            systemProperty 'rdi.debug', 'true'
            systemProperty 'rdi.play', Base64.encoder.encodeToString(playArg2.getBytes(Charset.forName("UTF-8")))
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        register(mod_id) {
            def localSourceSets = project.extensions.getByType(SourceSetContainer)
            sourceSet localSourceSets.named('main').get()
        }
    }
}

def localRuntimeConfiguration = configurations.maybeCreate('localRuntime')
def librariesConfiguration = configurations.maybeCreate('libraries')
def shadedConfiguration = configurations.maybeCreate('shaded')

configurations.named('runtimeClasspath') {
    extendsFrom localRuntimeConfiguration
}
configurations.named('implementation') {
    extendsFrom librariesConfiguration
}


def metadataOutput = layout.buildDirectory.dir('generated/sources/modMetadata')

tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties(replaceProperties)
    expand(replaceProperties)
    from 'src/main/templates'
    into metadataOutput
}

sourceSets.named('main') {
    kotlin.srcDir '../../../mc/common/2021/src/main/kotlin'
    kotlin.srcDir '../../../mc/rcmd/src/main/kotlin'
    resources.srcDir 'src/generated/resources'
    resources.srcDir metadataOutput
    // Make common assets visible in IDE dev runs (textures, lang, etc.)
    // without merging common Java packages into this module.
    resources.srcDir project(':c-mc-common').file('src/main/resources')
}

neoForge.ideSyncTask(tasks.named('generateModMetadata'))
//java cv configs
[configurations.clientLegacyClasspath, configurations.client2LegacyClasspath].each {
    it.attributes.attribute(
            ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE,
            ArtifactTypeDefinition.JAR_TYPE
    )
}
extraJavaModuleInfo {
    failOnMissingModuleInfo = false
    skipLocalJars = true

    module("org.bytedeco:javacv", "org.bytedeco.javacv") {
        patchRealModule()
        exportAllPackages()

        requires("java.desktop")
        requiresTransitive("org.bytedeco.javacpp")
        requires("org.bytedeco.ffmpeg")
    }

    activate(configurations.clientLegacyClasspath)
    activate(configurations.client2LegacyClasspath)
}
dependencies {
    implementation project(':c-mc-common')
    additionalRuntimeClasspath project(':c-mc-common')
    /*
    lalangmine
    implementation project(':rmcp-common')
    additionalRuntimeClasspath project(':rmcp-common')
    implementation project(':rmcp-client')
    additionalRuntimeClasspath project(':rmcp-client')
     implementation(jarJar("io.heapy.kotaml:kotaml-jvm:0.108.0"))
    jarJar("com.squareup.okio:okio-jvm:3.17.0")
    jarJar("it.krzeminski:snakeyaml-engine-kmp-jvm:4.0.1")
    jarJar("net.thauvin.erik.urlencoder:urlencoder-lib-jvm:1.6.0")
    shaded('io.fusionauth:java-http:1.4.0') {
        transitive = false
    }
    */
    implementation(project(':mediaproc')) {
        transitive = false
    }
    additionalRuntimeClasspath(project(':mediaproc')) {
        transitive = false
    }
    additionalRuntimeClasspath 'io.fusionauth:java-http:1.4.0'



    implementation("org.bytedeco:javacv:1.5.13") {
        transitive = false
    }
    implementation("org.bytedeco:javacpp:1.5.13")
    implementation("org.bytedeco:ffmpeg:8.0.1-1.5.13")

    additionalRuntimeClasspath("org.bytedeco:javacv:1.5.13") {
        transitive = false
    }
    additionalRuntimeClasspath("org.bytedeco:javacpp:1.5.13")
    additionalRuntimeClasspath("org.bytedeco:ffmpeg:8.0.1-1.5.13")
    additionalRuntimeClasspath("org.bytedeco:ffmpeg:8.0.1-1.5.13:windows-x86_64-gpl")
    additionalRuntimeClasspath("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0")


    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.21.2.313"
    // at runtime, use the full JEI jar for NeoForge
    runtimeOnly("mezz.jei:jei-1.21.1-neoforge:19.21.2.313")
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0")
    // Source: https://mvnrepository.com/artifact/org.jetbrains.kotlinx/kotlinx-coroutines-core
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0")
    //KOTAML yml


    runtimeOnly "dev.emi:emi-neoforge:1.1.24+1.21.1"


    //>>>Modrinth Mods<<<
    ['architectury-api:13.0.8+neoforge',
     'create:6.0.10+mc1.21.1',
     'sodium:mc1.21.1-0.6.13-neoforge',
     //  'dynamic-fps:T238FZpQ',
    ].each { dep ->
        implementation "maven.modrinth:$dep"
    }
    //>>>CurseForge Mods<<<
    [
            "ftb-library-forge-404465:7746959",
            "ftb-quests-forge-289412:7878289",
            "ftb-teams-forge-404468:7878281",
    ].each { dep ->
        implementation "curse.maven:$dep-deobf"
    }
    implementation "curse.maven:ftb-chunks-forge-314906:8241176-deobf"


}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
        excludeDirs += file('run')
    }
}
evaluationDependsOn(':c-mc-common')
project(':c-mc-common').ext.registerClientCopyTask(project)
