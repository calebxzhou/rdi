import java.nio.charset.Charset

plugins {
    id 'java'
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'xyz.wagyourtail.unimined' version '1.4.18-kappa'
    id 'net.kyori.blossom' version '2.2.0'
}

apply from: 'gradle/scripts/helpers.gradle'

// Early Assertions
assertProperty 'mod_version'
assertProperty 'root_package'
assertProperty 'mod_id'
assertProperty 'mod_name'

assertSubProperties 'use_access_transformer', 'access_transformer_locations'
assertSubProperties 'is_coremod', 'coremod_includes_mod', 'coremod_plugin_class_name'
assertSubProperties 'use_asset_mover', 'asset_mover_version'

setDefaultProperty 'generate_sources_jar', true, false
setDefaultProperty 'generate_javadocs_jar', true, false
setDefaultProperty 'minecraft_username', true, 'Developer'
setDefaultProperty 'minecraft_uuid', true, '68b314bb-adaf-52dd-ab96-b5ed00000000'
setDefaultProperty 'minecraft_username_another', true, 'AnotherDeveloper'
setDefaultProperty 'minecraft_uuid_another', true, '68b314bb-adaf-52dd-ab96-b5ed00000001'
setDefaultProperty 'extra_jvm_args', false, ''

def requestedTasks = gradle.startParameter.taskNames.collect { it.tokenize(':').last() } as Set
def useAnotherPlayer = requestedTasks.contains('runClientAnother')
def selectedPlayerName = propertyString(useAnotherPlayer ? 'minecraft_username_another' : 'minecraft_username')
def selectedPlayerUuid = propertyString(useAnotherPlayer ? 'minecraft_uuid_another' : 'minecraft_uuid')

version = "5-mc-client-${mcVersion}-cleanroom"
group = 'rdi'
base {
    archivesName.set('rdi')
}
evaluationDependsOn(":c-mc-common")
evaluationDependsOn(":c-mc-common2")
evaluationDependsOn(":rcmd")
evaluationDependsOn(":firmsection")
def rcmdJarTask = project(":rcmd").tasks.named("jar")
def rcmdJar = rcmdJarTask.flatMap { it.archiveFile }
def rcmdFiles = files(rcmdJar).builtBy(rcmdJarTask)
def firmsectionJarTask = project(":firmsection").tasks.named("jar")
def firmsectionJar = firmsectionJarTask.flatMap { it.archiveFile }
def firmsectionFiles = files(firmsectionJar).builtBy(firmsectionJarTask)
def remapTaskName = propertyBool('enable_shadow') ? "remapShadowJar" : "remapJar"

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
    if (propertyBool('generate_sources_jar')) {
        withSourcesJar()
    }
    if (propertyBool('generate_javadocs_jar')) {
        withJavadocJar()
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
    }
}

configurations {
    embed
    contain
    implementation.extendsFrom(embed)
    implementation.extendsFrom(contain)
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
}

unimined.minecraft {
    version "1.12.2"

    mappings {
        mcp("stable", "39-1.12")
    }

    cleanroom {
        if (propertyBool('use_access_transformer')) {
            accessTransformer "${rootProject.projectDir}/src/main/resources/${propertyString('access_transformer_locations')}"
        }
        loader "0.5.12-alpha"
        runs.auth.username = selectedPlayerName
        def playArg = [
                "http://127.0.0.1:65231",
                "127.0.0.1:65230",
                "测试测试12123大世界",
                "25565",
                selectedPlayerUuid,
                selectedPlayerName
        ].join("\n")
        runs.all {
            jvmArgs(
                    "-Drdi.play=${Base64.encoder.encodeToString(playArg.getBytes(Charset.forName("UTF-8")))}",
                    "-Dcrl.dev.mixin=${mod_id}.default.mixin.json,${mod_id}.mod.mixin.json"
            )
            def extraArgs = propertyString('extra_jvm_args')
            if (extraArgs != null && !extraArgs.trim().isEmpty()) {
                jvmArgs += extraArgs.split { "\\s+" }.toList()
            }
            if (propertyBool('enable_foundation_debug')) {
                systemProperty("foundation.dump", "true")
                systemProperty("foundation.verbose", "true")
            }
            if (propertyBool('is_coremod')) {
                systemProperty("fml.coreMods.load", propertyString('coremod_plugin_class_name'))
            }
            args("--width", "2560", "--height", "1440", "--username", selectedPlayerName,
                    "--uuid", selectedPlayerUuid.replace("-", ""), "--server","127.0.0.1","--port","50975")
            return
        }
        runs.config("client") {
            if (useAnotherPlayer) {
                workingDir = project.file("run/client-another")
            }
        }
    }

    defaultRemapJar = false

    def jarTaskName = propertyBool('enable_shadow') ? "shadowJar" : "jar"
    remap(tasks.named(jarTaskName).get()) {
        mixinRemap {
            enableBaseMixin()
            enableMixinExtra()
            disableRefmap()
        }
    }

    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

dependencies {
    if (propertyBool('use_asset_mover')) {
        implementation "com.cleanroommc:assetmover:${propertyString('asset_mover_version')}"
    }
    if (propertyBool('enable_junit_testing')) {
        testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    implementation(project(":c-mc-common"))
    implementation(project(":c-mc-common2"))
    compileOnly rcmdFiles
    runtimeOnly rcmdFiles
    compileOnly firmsectionFiles
    runtimeOnly firmsectionFiles
}

apply from: 'gradle/scripts/dependencies.gradle'

processResources {
    dependsOn project(":c-mc-common").tasks.processResources
    dependsOn project(":c-mc-common2").tasks.processResources

    inputs.property 'mod_id', propertyString('mod_id')
    inputs.property 'mod_name', propertyString('mod_name')
    inputs.property 'mod_version', propertyString('mod_version')
    inputs.property 'mod_description', propertyString('mod_description')
    inputs.property 'mod_authors', "${propertyStringList('mod_authors', ',').join(', ')}"
    inputs.property 'mod_credits', propertyString('mod_credits')
    inputs.property 'mod_url', propertyString('mod_url')
    inputs.property 'mod_update_json', propertyString('mod_update_json')
    inputs.property 'mod_logo_path', propertyString('mod_logo_path')

    def filterList = ['mcmod.info', 'pack.mcmeta']

    filesMatching(filterList) { fcd ->
        fcd.expand(
                'mod_id': propertyString('mod_id'),
                'mod_name': propertyString('mod_name'),
                'mod_version': propertyString('mod_version'),
                'mod_description': propertyString('mod_description'),
                'mod_authors': "${propertyStringList('mod_authors', ',').join(', ')}",
                'mod_credits': propertyString('mod_credits'),
                'mod_url': propertyString('mod_url'),
                'mod_update_json': propertyString('mod_update_json'),
                'mod_logo_path': propertyString('mod_logo_path'),
        )
    }

    rename '(.+_at.cfg)', 'META-INF/$1'
}

sourceSets {
    main {
        java {
            srcDir project(":c-mc-common").sourceSets.main.java.srcDirs
            srcDir project(":c-mc-common2").sourceSets.main.java.srcDirs
        }
        resources {
            srcDir project(":c-mc-common").sourceSets.main.resources.srcDirs
            srcDir project(":c-mc-common2").sourceSets.main.resources.srcDirs
        }
        blossom {
            javaSources {
                property('mod_id', propertyString('mod_id'))
                property('mod_name', propertyString('mod_name'))
                property('mod_version', propertyString('mod_version'))
                property('package', "${root_package}.${mod_id}")
            }
        }
    }
}

if (!propertyBool('enable_shadow')) {
    shadowJar.enabled = false
}

jar {
    archiveVersion = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn rcmdJarTask
    dependsOn firmsectionJarTask
    from({ zipTree(rcmdJar.get().asFile) }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
    from({ zipTree(firmsectionJar.get().asFile) }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
    if (configurations.contain.size() > 0) {
        into('/') {
            from configurations.contain
        }
    }
    doFirst {
        manifest {
            def attribute_map = [:]
            attribute_map['ModType'] = "CRL"
            attribute_map['MixinConfigs'] = "${mod_id}.default.mixin.json,${mod_id}.mod.mixin.json"
            if (configurations.contain.size() > 0) {
                attribute_map['ContainedDeps'] = configurations.contain.collect { it.name }.join(' ')
                attribute_map['NonModDeps'] = true
            }
            if (propertyBool('is_coremod')) {
                attribute_map['FMLCorePlugin'] = propertyString('coremod_plugin_class_name')
                if (propertyBool('coremod_includes_mod')) {
                    attribute_map['FMLCorePluginContainsFMLMod'] = true
                }
            }
            if (propertyBool('use_access_transformer')) {
                attribute_map['FMLAT'] = propertyString('access_transformer_locations')
            }
            attributes(attribute_map)
        }
    }
    finalizedBy(tasks.named(remapTaskName).get())
}

tasks.named("compileJava") {
    dependsOn rcmdJarTask
    dependsOn firmsectionJarTask
}

tasks.named("compileKotlin") {
    dependsOn rcmdJarTask
    dependsOn firmsectionJarTask
}


shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier = "shadow"
}

tasks.named(remapTaskName).configure {
    notCompatibleWithConfigurationCache("Unimined remapJar task is not compatible with configuration cache")
    doFirst {
        logging.captureStandardOutput LogLevel.INFO
    }
    doLast {
        logging.captureStandardOutput LogLevel.QUIET
    }
}

tasks.named('preRunClient') {
    notCompatibleWithConfigurationCache("Unimined preRunClient task is not compatible with configuration cache")
    dependsOn("copyResourcesToDevClasses")
}

tasks.register("copyResourcesToDevClasses", Copy) {
    dependsOn(tasks.named("processResources"))
    dependsOn(tasks.named("compileKotlin"))
    from(layout.buildDirectory.dir("resources/main")) {
        include("assets/**")
    }
    from(layout.buildDirectory.dir("classes/kotlin/main")) {
        include("**/*.class")
        include("META-INF/**")
    }
    into(layout.buildDirectory.dir("classes/java/main"))
}

tasks.register("runClientAnother") {
    group = "minecraft"
    description = "Run Minecraft client with another player name and RDI play arg"
    dependsOn("runClient")
}

compileTestJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    })
    if (propertyBool('show_testing_output')) {
        testLogging {
            showStandardStreams = true
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'
project(':c-mc-common').ext.registerClientCopyTask(project)
