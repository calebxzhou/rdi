pluginManagement {
    repositories {
        mavenCentral()
        maven {
            url = "https://maven.neoforged.net/releases"
        }
        maven {
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            url = "https://maven.fabricmc.net/"
        }
        maven {
            url = "https://maven.wagyourtail.xyz/releases"
        }
        maven {
            url = "https://maven.outlands.top/releases"
        }

        maven {
            url = "https://maven.wagyourtail.xyz/snapshots"
        }
        gradlePluginPortal() {
            content {
                excludeGroup("org.apache.logging.log4j")
            }
        }
    }
}

plugins {
    // Automatic toolchain provisioning
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Due to an IntelliJ bug, this has to be done
// rootProject.name = archives_base_name
rootProject.name = rootProject.projectDir.getName()
rootProject.name = "c12"
include(":c-mc-common")
project(":c-mc-common").projectDir = file("../common")
include(":c-mc-common2")
project(":c-mc-common2").projectDir = file("../common2")
include(":rcmd")
project(":rcmd").projectDir = file("../../../mc/rcmd")
include(":firmsection")
project(":firmsection").projectDir = file("../../../mc/firmsection")
