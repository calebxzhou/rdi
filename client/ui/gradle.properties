className=calebxzhou.rdi.client.MainKt
funName=main
#开发模式(dev mode)默认开启，便于Compose hot reload减少重复配置开销
org.gradle.configuration-cache=true
android.useAndroidX=true
android.injected.testOnly=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.daemon.jvmargs=-Xmx8G
# build.gradle.kts会根据rdi.devMode切换DAEMON/IN_PROCESS
rdi.devMode=true
# AGP 9.0 built-in Kotlin conflicts with kotlin("multiplatform") — bypass it
#android.builtInKotlin=false
#android.newDsl=false
