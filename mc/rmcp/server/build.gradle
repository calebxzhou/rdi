plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
}

group = "calebxzhou.rdi.mc.rmcp"
version = "0.1"

ext.kotlinxSerializationVersion = "1.9.0"
ext.kotlinRuntimeVersion = "2.3.0"

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

kotlin {
    jvmToolchain(25)
}

dependencies {
    api project(':rmcp-common')
    implementation project(':ktutils-std')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
